<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660">
  <!--
    Orion family diagram template. Copy it, keep <defs> and <style>, replace the body.
    Classes: .step (our code) .ext (backend / external system) .ok (success end) .fail (failure path)
             .decision (diamond) .note (side remark) .lane (sequence lifeline)
    Arrows: class="flow" (main path), "flow alt" (alternate / failure path, dashed), "flow back" (response).
  -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Segoe UI", Inter, "Helvetica Neue", Arial, sans-serif; fill: #1e1b4b; }
    .title { font-size: 24px; font-weight: 700; }
    .subtitle { font-size: 14px; fill: #475569; }
    .label { font-size: 15px; font-weight: 600; }
    .small { font-size: 12.5px; fill: #475569; }
    .code { font-family: "Cascadia Code", Consolas, "SF Mono", monospace; font-size: 13px; fill: #3730a3; }
    .edge { font-size: 12.5px; fill: #334155; }
    .step { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2; }
    .ext { fill: #f0f9ff; stroke: #0284c7; stroke-width: 2; }
    .ok { fill: #ecfdf5; stroke: #059669; stroke-width: 2; }
    .fail { fill: #fef2f2; stroke: #dc2626; stroke-width: 2; }
    .decision { fill: #fffbeb; stroke: #d97706; stroke-width: 2; }
    .note { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .lane { stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .flow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
    .flow.alt { stroke: #dc2626; stroke-dasharray: 6 4; marker-end: url(#arrow-fail); }
    .flow.back { stroke-dasharray: 6 4; }
    .badge { fill: #4f46e5; }
    .badge-text { font-size: 12px; font-weight: 700; fill: #ffffff; }
  </style>

  <rect width="1200" height="660" fill="#ffffff"/>

  <text class="title" x="40" y="52">OrionCache - entry expiry and invalidation</text>
  <text class="subtitle" x="40" y="78">Every read re-checks the entry against IOrionClock and its tags, so an expired or invalidated value is never returned.</text>

  <!-- write -->
  <rect class="step" x="40" y="115" width="260" height="90" rx="14"/>
  <text class="label" x="170" y="145" text-anchor="middle">Entry written</text>
  <text class="code" x="170" y="168" text-anchor="middle">SetAsync or a factory</text>
  <text class="small" x="170" y="190" text-anchor="middle">tags captured at write</text>

  <path class="flow" d="M300,160 L358,160"/>

  <rect class="step" x="360" y="115" width="420" height="90" rx="14"/>
  <text class="label" x="570" y="145" text-anchor="middle">Logical expiry stored</text>
  <text class="small" x="570" y="168" text-anchor="middle">now + (Expiration ?? DefaultExpiration)</text>
  <text class="small" x="570" y="190" text-anchor="middle">sliding: now + SlidingExpiration, capped by Expiration</text>

  <rect class="note" x="820" y="115" width="340" height="90" rx="10"/>
  <text class="small" x="840" y="142">IMemoryCache also gets a real-time</text>
  <text class="small" x="840" y="162">eviction as a backstop; the clock check</text>
  <text class="small" x="840" y="182">below always wins on read.</text>

  <!-- read -->
  <path class="flow" d="M170,205 L170,343"/>
  <text class="edge" x="182" y="280">later</text>
  <rect class="step" x="40" y="345" width="260" height="70" rx="14"/>
  <text class="label" x="170" y="375" text-anchor="middle">Read</text>
  <text class="code" x="170" y="397" text-anchor="middle">TryGetAsync / GetOrCreate</text>

  <path class="flow" d="M300,380 L328,380"/>

  <!-- D1: expired -->
  <polygon class="decision" points="450,315 570,380 450,445 330,380"/>
  <text class="code" x="450" y="376" text-anchor="middle" style="font-variant-ligatures: none">clock.UtcNow &gt;=</text>
  <text class="code" x="450" y="394" text-anchor="middle">expiry?</text>

  <path class="flow" d="M570,380 L628,380"/>
  <text class="edge" x="599" y="370" text-anchor="middle">no</text>

  <!-- D2: tag invalidated -->
  <polygon class="decision" points="750,315 870,380 750,445 630,380"/>
  <text class="label" x="750" y="376" text-anchor="middle">A tag</text>
  <text class="label" x="750" y="396" text-anchor="middle">invalidated?</text>

  <path class="flow" d="M870,380 L918,380"/>
  <text class="edge" x="894" y="370" text-anchor="middle">no</text>

  <!-- hit -->
  <rect class="ok" x="920" y="335" width="240" height="90" rx="14"/>
  <text class="label" x="1040" y="364" text-anchor="middle">Hit: value returned</text>
  <text class="small" x="1040" y="386" text-anchor="middle">sliding: expiry moves to</text>
  <text class="small" x="1040" y="406" text-anchor="middle">now + SlidingExpiration, capped</text>

  <!-- misses -->
  <path class="flow alt" d="M450,445 L450,503"/>
  <text class="edge" x="462" y="479">yes</text>
  <rect class="fail" x="340" y="505" width="220" height="70" rx="14"/>
  <text class="label" x="450" y="535" text-anchor="middle">Miss: expired</text>
  <text class="small" x="450" y="557" text-anchor="middle">GetOrCreate runs the factory</text>

  <path class="flow alt" d="M750,445 L750,503"/>
  <text class="edge" x="762" y="479">yes</text>
  <rect class="fail" x="640" y="505" width="220" height="70" rx="14"/>
  <text class="label" x="750" y="535" text-anchor="middle">Miss: invalidated</text>
  <text class="small" x="750" y="557" text-anchor="middle">GetOrCreate runs the factory</text>

  <!-- invalidation note -->
  <rect class="note" x="900" y="465" width="260" height="165" rx="10"/>
  <text class="code" x="920" y="492">InvalidateTagAsync(tag)</text>
  <text class="small" x="920" y="514">expires every entry with the tag,</text>
  <text class="small" x="920" y="532">including factories in flight.</text>
  <text class="code" x="920" y="562">SetAsync / RemoveAsync</text>
  <text class="small" x="920" y="584">during a flight: that factory's</text>
  <text class="small" x="920" y="602">value is returned to its callers</text>
  <text class="small" x="920" y="620">but not written to the cache.</text>

  <rect class="note" x="40" y="505" width="260" height="70" rx="10"/>
  <text class="small" x="60" y="532">A value stored under another</text>
  <text class="small" x="60" y="552">type is a miss, not a cast error.</text>
</svg>
